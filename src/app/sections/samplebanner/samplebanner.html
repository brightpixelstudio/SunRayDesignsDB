<div class="row">
  <div class="samplebanner-container col-12">
    <div class="row">
      <div class="col-12">
        <h1 class="animate__animated animate__rubberBand">Be Unique. Get Noticed.</h1>
      </div>
      <div class="col-12">
        <h4>
          We are a Design and Marketing Studio specializing in creating unique and distinctive
          websites.
        </h4>
      </div>
      <div class="col-12" class="gallerydiv">
        <fslightbox [toggler]="toggler" [sources]="sources" />
        <button id="GalleryButton" (click)="toggler = !toggler">View Gallery</button>
      </div>
    </div>

    <div id="twoImageCarousel" class="carousel slide pt-5" data-bs-ride="carousel">
      <!-- Slide Position Indicators -->
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#twoImageCarousel"
          data-bs-slide-to="0"
          class="active"
          aria-current="true"
          aria-label="Slide 1"
        ></button>
        <button
          type="button"
          data-bs-target="#twoImageCarousel"
          data-bs-slide-to="1"
          aria-label="Slide 2"
        ></button>
        <button
          type="button"
          data-bs-target="#twoImageCarousel"
          data-bs-slide-to="2"
          aria-label="Slide 3"
        ></button>
        <button
          type="button"
          data-bs-target="#twoImageCarousel"
          data-bs-slide-to="3"
          aria-label="Slide 4"
        ></button>
        <button
          type="button"
          data-bs-target="#twoImageCarousel"
          data-bs-slide-to="4"
          aria-label="Slide 5"
        ></button>
      </div>

      <!-- Main Slides Wrappet -->
      @if (workList.length > 0) {
        <div class="carousel-inner">
          <div class="carousel-item active">
            <div class="row justify-content-center" style="height: 40vh">
              <a
                href="/images/ourwork/web/large/{{ workList[0].number }}_Image.jpg"
                data-gallery="example-gallery"
                style="width: auto !important"
                target="_blank"
              >
                <img
                  class="col-sm-4"
                  src="/images/ourwork/web/{{ workList[0].number }}_Image.jpg"
                  alt=""
                />
              </a>
              <a
                href="/images/ourwork/web/large/{{ workList[1].number }}_Image.jpg"
                data-gallery="example-gallery"
                style="width: auto !important"
                target="_blank"
              >
                <img
                  class="col-sm-4"
                  src="/images/ourwork/web/{{ workList[1].number }}_Image.jpg"
                  alt=""
                />
              </a>
            </div>
          </div>
          <div class="carousel-item">
            <div class="row justify-content-center" style="height: 40vh">
              <a
                href="/images/ourwork/web/large/{{ workList[2].number }}_Image.jpg"
                data-gallery="example-gallery"
                style="width: auto !important"
                target="_blank"
              >
                <img
                  class="col-sm-4"
                  src="/images/ourwork/web/{{ workList[2].number }}_Image.jpg"
                  alt=""
                />
              </a>
              <a
                href="/images/ourwork/web/large/{{ workList[3].number }}_Image.jpg"
                data-gallery="example-gallery"
                style="width: auto !important"
                target="_blank"
              >
                <img
                  class="col-sm-4"
                  src="/images/ourwork/web/{{ workList[3].number }}_Image.jpg"
                  alt=""
                />
              </a>
            </div>
          </div>
          <div class="carousel-item">
            <div class="row justify-content-center" style="height: 40vh">
              <a
                href="/images/ourwork/web/large/{{ workList[4].number }}_Image.jpg"
                data-gallery="example-gallery"
                style="width: auto !important"
                target="_blank"
              >
                <img
                  class="col-sm-4"
                  src="/images/ourwork/web/{{ workList[4].number }}_Image.jpg"

              <a

          <div class="carousel-item">

                data-gallery="example-gallery"

                target="_blank"
              >
                <img
                  class="col-sm-4"
                  src="/images/ourwork/web/{{ workList[6].number }}_Image.jpg"
                  alt=""
                />
              </a>
              <a
                href="/images/ourwork/web/large/{{ workList[7].number }}_Image.jpg"
                data-gallery="example-gallery"
                style="width: auto !important"
                target="_blank"
              >
                <img
                  class="col-sm-4"
                  src="/images/ourwork/web/{{ workList[7].number }}_Image.jpg"
                  alt=""
                />
              </a>
            </div>
          </div>
          <div class="carousel-item">
            <div class="row justify-content-center" style="height: 40vh">
              <a

                  alt=""
                />
              </a>
              <a
                href="/images/ourwork/web/large/{{ workList[9].number }}_Image.jpg"
                data-gallery="example-gallery"
                style="width: auto !important"
                target="_blank"
              >
                <img
                  class="col-sm-4"
                  src="/images/ourwork/web/{{ workList[9].number }}_Image.jpg"
                  alt=""
                />
              </a>
            </div>
          </div>
        </div>
      }

      <!-- Left Navigation Arrow Control Button -->
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#twoImageCarousel"
        data-bs-slide="prev"
      >
        <span class="fas fa-chevron-left" style="font-size: 4rem"></span>
        <span class="visually-hidden">Previous</span>
      </button>

      <!-- Right Navigation Arrow Control Button -->
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#twoImageCarousel"
        data-bs-slide="next"
      >
        <span class="fas fa-chevron-right" style="font-size: 4rem"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
</div>
<div class="row">
  <div class="whiteline col-12"></div>
</div>
