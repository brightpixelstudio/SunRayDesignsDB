<div class="row" id="work-section">
  <div class="designs-container col-12">
    <div class="row pt-5 ps-4">
      <div class="col-1"></div>
      <div
        id="DesignsWebsite"
        class="col-3 barn"
        (click)="toggleWebsiteContent()"
        style="cursor: pointer"
      >
        <img [src]="currentImageWebsite" alt="" class="img-fluid" />
        <h1 [class]="isVisableWebsiteContent ? '' : 'disabled'">Websites</h1>
      </div>
      <div
        id="DesignsPrint"
        class="col-3 barn"
        (click)="togglePrintContent()"
        style="cursor: pointer"
      >
        <img [src]="currentImagePrint" alt="" class="img-fluid" />
        <h1 [class]="isVisablePrintContent ? '' : 'disabled'">Print</h1>
      </div>
      <div
        id="DesignsMobile"
        class="col-3 barn"
        (click)="toggleMobileContent()"
        style="cursor: pointer"
      >
        <img [src]="currentImageMobile" alt="" class="img-fluid" />
        <h1 [class]="isVisableMobileContent ? '' : 'disabled'">Mobile</h1>
      </div>
      <div class="col-1"></div>
    </div>
    @if (isVisableWebsiteContent) {
      <div class="col-12 gallerydiv">
        <fslightbox [toggler]="toggler" [sources]="sources" />
        <button id="GalleryButton" (click)="toggler = !toggler">View Gallery</button>
      </div>
      <div id="DesignsWebsiteContent" class="designs">
        @for (user of work; track user.name; let i = $index; let isLast = $last) {
          @if (i % 4 === 0) {
            <div class="row">
              <div class="col-3">
                <div class="row pt-4 ps-2 design">
                  <a
                    href="/images/ourwork/web/large/{{ user.number }}_Image.jpg"
                    target="_blank"
                    data-gallery="example-gallery"
                    class="col-l-3"
                  >
                    <img
                      src="/images/ourwork/web/{{ user.number }}_Image.jpg"
                      class="img-fluid img-thumbnail"
                    />
                  </a>
                </div>
              </div>
              <div class="col-3">
                <div class="row pt-4 ps-2 design">
                  <a
                    href="/images/ourwork/web/large/{{ user.number + 1 }}_Image.jpg"
                    target="_blank"
                    data-gallery="example-gallery"
                    class="col-l-3"
                  >
                    <img
                      src="/images/ourwork/web/{{ user.number + 1 }}_Image.jpg"
                      class="img-fluid img-thumbnail"
                    />
                  </a>
                </div>
              </div>
              <div class="col-3">
                <div class="row pt-4 ps-2 design">
                  <a
                    href="/images/ourwork/web/large/{{ user.number + 2 }}_Image.jpg"
                    target="_blank"
                    data-gallery="example-gallery"
                    class="col-l-3"
                  >
                    <img
                      src="/images/ourwork/web/{{ user.number + 2 }}_Image.jpg"
                      class="img-fluid img-thumbnail"
                    />
                  </a>
                </div>
              </div>
              <div class="col-3">
                <div class="row pt-4 ps-2 design">
                  <a
                    href="/images/ourwork/web/large/{{ user.number + 3 }}_Image.jpg"
                    target="_blank"
                    data-gallery="example-gallery"
                    class="col-l-3"
                  >
                    <img
                      src="/images/ourwork/web/{{ user.number + 3 }}_Image.jpg"
                      class="img-fluid img-thumbnail"
                    />
                  </a>
                </div>
              </div>
            </div>
          }
        }
      </div>
    }
