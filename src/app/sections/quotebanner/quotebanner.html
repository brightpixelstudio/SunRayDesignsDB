<div class="row">
  <div class="quotebanner-container col-12">
    <div id="quoteImageCarousel" class="carousel slide pt-5" data-bs-ride="carousel">
      <!-- Slide Position Indicators -->
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#quoteImageCarousel"
          data-bs-slide-to="0"
          class="active"
          aria-current="true"
          aria-label="Slide 1"
        ></button>
        <button
          type="button"
          data-bs-target="#quoteImageCarousel"
          data-bs-slide-to="1"
          aria-label="Slide 2"
        ></button>
        <button
          type="button"
          data-bs-target="#quoteImageCarousel"
          data-bs-slide-to="2"
          aria-label="Slide 3"
        ></button>
        <button
          type="button"
          data-bs-target="#quoteImageCarousel"
          data-bs-slide-to="3"
          aria-label="Slide 4"
        ></button>
      </div>

      <!-- Main Slides Wrapper -->
      <div class="carousel-inner">
        @if (quoteList.length > 0) {
          <div class="carousel-item active">
            <div class="row">
              <div class="col-1 ps-5 quotelogo">
                <img class="img-fluid" src="/images/quote.png" alt="" />
              </div>
              <div class="col-10">
                <h2>
                  {{ quoteList[0].quote }}
                </h2>
              </div>
            </div>
            <div class="row">
              <div class="col-11 p-3 text-end">
                <h3>- {{ quoteList[0].user }}</h3>
              </div>
              <div class="col-1"></div>
            </div>
          </div>
          <div class="carousel-item">
            <div class="row">
              <div class="col-1 ps-5 quotelogo">
                <img class="img-fluid" src="/images/quote.png" alt="" />
              </div>
              <div class="col-10">
                <h2>
                  {{ quoteList[1].quote }}
                </h2>
              </div>
            </div>
            <div class="row">
              <div class="col-11 p-3 text-end">
                <h3>- {{ quoteList[1].user }}</h3>
              </div>
              <div class="col-1"></div>
            </div>
          </div>
          <div class="carousel-item">
            <div class="row">
              <div class="col-1 ps-5 quotelogo">
                <img class="img-fluid" src="/images/quote.png" alt="" />
              </div>
              <div class="col-10">
                <h2>
                  {{ quoteList[2].quote }}
                </h2>
              </div>
            </div>
            <div class="row">
              <div class="col-11 p-3 text-end">
                <h3>- {{ quoteList[2].user }}</h3>
              </div>
              <div class="col-1"></div>
            </div>
          </div>
          <div class="carousel-item">
            <div class="row">
              <div class="col-1 ps-5 quotelogo">
                <img class="img-fluid" src="/images/quote.png" alt="" />
              </div>
              <div class="col-10">
                <h2>
                  {{ quoteList[3].quote }}
                </h2>
              </div>
            </div>
            <div class="row">
              <div class="col-11 p-3 text-end">
                <h3>- {{ quoteList[3].user }}</h3>
              </div>
              <div class="col-1"></div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
