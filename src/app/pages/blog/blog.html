<div class="row" id="blog-section">
  @if (isContentLoaded) {
    <div id="DesignsLatestContent" class="designs gallerydiv">
      <div class="row">
        <div class="col-1"></div>
        <div class="col-10">
          <h3>All Posts</h3>
        </div>
        <div class="col-1"></div>
      </div>
      <div class="row">
        <div class="col-1"></div>
        <div class="col-10">
          <table class="table table-striped table-bordered table-sm table-responsive">
            <thead>
              <tr>
                <th scope="col">Title</th>
                <th scope="col">Category</th>
                <th scope="col">URL</th>
                <th scope="col">Author</th>
                <th scope="col">Post Date</th>
              </tr>
            </thead>
            <tbody>
              @for (post of allPostList; track post.blogpostid) {
                <tr>
                  <td>
                    {{ post.title }}
                  </td>
                  <td>
                    {{ post.category }}
                  </td>
                  <td>
                    {{ post.url }}
                  </td>
                  <td>
                    {{ post.author }}
                  </td>
                  <td>
                    {{ post.dateposted | date: 'mediumDate' }}
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
        <div class="col-1"></div>
      </div>
    </div>
  }
</div>
